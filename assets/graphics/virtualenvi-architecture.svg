<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto">
  <defs>
    <linearGradient id="veBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F1B22"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <pattern id="veGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="340" rx="12" fill="url(#veBg)"/>
  <rect width="920" height="340" rx="12" fill="url(#veGrid)"/>
  <rect x="1" y="1" width="918" height="338" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="920" height="3" fill="url(#emeraldBar)"/>

  <!-- Title Header -->
  <g transform="translate(40, 32)">
    <rect width="180" height="20" rx="4" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="8" cy="10" r="2.5" fill="#34D399"/>
    <text x="16" y="14" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#6EE7B7" letter-spacing="1">FRONTEND ARCHITECTURE</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">
      Component-Driven Composition &amp; Declarative Motion Pipeline
    </text>
  </g>

  <!-- ================= 4 ARCHITECTURAL BLOCKS ================= -->

  <!-- Block 1: Viewport & Layout -->
  <g transform="translate(40, 110)">
    <rect width="190" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <rect width="190" height="24" rx="8" fill="#1E293B"/>
    <text x="12" y="16" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#38BDF8">[01] VIEWPORT ADAPTER</text>

    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Mobile-First Layout</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Fluid Flexbox &amp; CSS Grid</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Custom Media Breakpoints</text>
    <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Touch Gesture Handlers</text>

    <!-- Mini Visual -->
    <rect x="45" y="120" width="100" height="42" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <rect x="55" y="128" width="80" height="6" rx="2" fill="#38BDF8" opacity="0.6"/>
    <rect x="55" y="138" width="50" height="6" rx="2" fill="#94A3B8" opacity="0.4"/>
  </g>

  <!-- Connector 1 -->
  <path d="M 230 200 L 255 200" stroke="#10B981" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="258,200 253,197 253,203" fill="#10B981"/>

  <!-- Block 2: Framer Motion Engine -->
  <g transform="translate(255, 110)">
    <rect width="200" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="24" rx="8" fill="#1E293B"/>
    <text x="12" y="16" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#C084FC">[02] MOTION PIPELINE</text>

    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Framer Motion</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Spring Physics Easing</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• AnimatePresence Lifecycle</text>
    <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Hardware Accelerated (GPU)</text>

    <!-- Mini Visual: Spring wave -->
    <rect x="45" y="120" width="110" height="42" rx="4" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
    <path d="M 55 145 Q 75 125, 95 145 T 135 135" fill="none" stroke="#C084FC" stroke-width="2"/>
    <circle cx="135" cy="135" r="3" fill="#00F2FE"/>
  </g>

  <!-- Connector 2 -->
  <path d="M 455 200 L 480 200" stroke="#10B981" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="483,200 478,197 478,203" fill="#10B981"/>

  <!-- Block 3: React UI Components -->
  <g transform="translate(480, 110)">
    <rect width="200" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="24" rx="8" fill="#1E293B"/>
    <text x="12" y="16" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#10B981">[03] REACT 18 TREE</text>

    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Modular Components</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Hero &amp; Feature Sections</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Interactive Modals &amp; Hubs</text>
    <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Optimized Re-rendering</text>

    <!-- Mini Visual: Component hierarchy -->
    <rect x="45" y="120" width="110" height="42" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <rect x="55" y="128" width="30" height="12" rx="2" fill="#10B981" opacity="0.6"/>
    <rect x="90" y="128" width="30" height="12" rx="2" fill="#38BDF8" opacity="0.6"/>
    <rect x="125" y="128" width="20" height="12" rx="2" fill="#A855F7" opacity="0.6"/>
  </g>

  <!-- Connector 3 -->
  <path d="M 680 200 L 705 200" stroke="#10B981" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="708,200 703,197 703,203" fill="#10B981"/>

  <!-- Block 4: Cloud Edge Delivery -->
  <g transform="translate(705, 110)">
    <rect width="175" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <rect width="175" height="24" rx="8" fill="#1E293B"/>
    <text x="12" y="16" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#FBBF24">[04] NETLIFY EDGE</text>

    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Production CDN</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Continuous Deployment</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• SPA Redirect Rules</text>
    <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Edge Asset Caching</text>

    <!-- Mini Visual: Cloud -->
    <rect x="35" y="120" width="105" height="42" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="87" cy="141" r="12" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="73" y="144" font-family="'SF Mono', Consolas, monospace" font-size="8" fill="#FBBF24">CDN</text>
  </g>
</svg>
